# Simulation-CI: Build + Physik-Smoke-Test und Valgrind-Speichercheck.
#
# Laeuft in Containern (podman), damit die Steps als root Pakete via apt
# installieren koennen -- der Host-Executor des Runners ist non-root.
# Basis 'buildpack-deps:bookworm' bringt git (fuer den Checkout) und gcc mit.
#
# Nur billige Checks -- schwere Rechnung (Scaling, GPU, 1000-Ensembles)
# gehoert auf den Cluster, nicht in CI.
name: Simulation CI

on:
  push:
  pull_request:

jobs:
  build-and-physics:
    runs-on: ubuntu-latest
    container:
      image: buildpack-deps:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten (gcc, OpenMPI)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential openmpi-bin libopenmpi-dev
      - name: Build + Physik-Smoke-Test
        run: bash scripts/ci/build_and_test.sh

  valgrind:
    runs-on: ubuntu-latest
    container:
      image: buildpack-deps:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten (gcc, Valgrind)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential valgrind
      - name: Valgrind-Speichercheck (seriell)
        run: bash scripts/ci/valgrind_check.sh

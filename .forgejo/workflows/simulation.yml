# Simulation-CI: Build + Physik-Smoke-Test und Valgrind-Speichercheck.
#
# Voraussetzungen:
#   - Ein registrierter Forgejo-Actions-Runner mit Label 'ubuntu-latest'
#     auf Debian/Ubuntu-Basis (die Steps installieren Pakete via apt als root).
#   - Nur billige Checks -- schwere Rechnung (Scaling, GPU, 1000-Ensembles)
#     gehoert auf den Cluster, nicht in CI.
name: Simulation CI

on:
  push:
  pull_request:

jobs:
  build-and-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten (gcc, OpenMPI)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential openmpi-bin libopenmpi-dev
      - name: Build + Physik-Smoke-Test
        run: bash scripts/ci/build_and_test.sh

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten (gcc, Valgrind)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential valgrind
      - name: Valgrind-Speichercheck (seriell)
        run: bash scripts/ci/valgrind_check.sh

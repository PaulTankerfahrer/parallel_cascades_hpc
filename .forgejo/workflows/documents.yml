# Dokumente-CI: Bericht und Präsentation mit TeXLive bauen, PDFs als Artefakt.
#
# Faengt LaTeX-Fehler (fehlende Pakete, kaputte Referenzen, Escape-Artefakte)
# und stellt bei jedem Push frische PDFs zum Download bereit.
#
# Basis 'node:20-bookworm' statt 'texlive/texlive': Forgejo fuehrt JS-Actions
# (checkout, upload-artifact) mit dem Container-node aus -- das TeXLive-Image
# bringt kein node mit. Wir installieren eine TeXLive-Teilmenge via apt
# (reicht fuer beamer/metropolis, siunitx, babel-german, tikz/pgf).
#
# Laeuft NICHT bei jedem Push, sondern nur wenn die Commit-Message das
# Schluesselwort 'document' enthaelt -- oder manuell via workflow_dispatch.
name: Dokumente

on:
  push:
  workflow_dispatch:

jobs:
  latex:
    # Nur bauen, wenn ausdruecklich gewuenscht (Keyword) oder manuell gestartet.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'document') }}
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: TeXLive installieren
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra lmodern \
            texlive-lang-german texlive-science texlive-pictures \
            texlive-plain-generic latexmk
      - name: Bericht bauen (report.pdf)
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error report.tex
          pdflatex -interaction=nonstopmode -halt-on-error report.tex
      - name: Präsentation bauen (physik_praesentation.pdf)
        working-directory: presentation
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error physik_praesentation.tex
          pdflatex -interaction=nonstopmode -halt-on-error physik_praesentation.tex
      - name: PDFs als Artefakt hochladen
        uses: actions/upload-artifact@v3
        with:
          name: pdfs
          path: |
            report.pdf
            presentation/physik_praesentation.pdf
          if-no-files-found: error

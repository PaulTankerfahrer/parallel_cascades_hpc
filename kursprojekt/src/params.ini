# =============================================================================
#  params.ini  --  Konfiguration fuer den Skalierungs-Benchmark (Strong Scaling)
# -----------------------------------------------------------------------------
#
#  ZWECK DIESER DATEI
#  Diese Datei steuert einen BENCHMARK-Lauf, dessen Ziel die Zeitmessung ist,
#  nicht eine physikalisch vollstaendige Kaskade.
#  Problemgroesse ~2 Mio. Atome (1414 x 1414) ist gross genug, dass die
#  Rechenzeit dominiert, aber klein genug fuer einen 1-Rank-Basislauf in ~10 min.
#
#  ALLE DREI IMPLEMENTIERUNGEN (cascade_serial, mpi_cascade, cascade_cuda)
#  lesen dieselbe Datei -- keine Neukompilierung noetig bei Parameteraenderung.
#
#  FORMAT
#  - Kommentare: # oder ;  (beide Zeichen werden ignoriert)
#  - Sektionen:  [sektionsname]
#  - Zuweisung:  schluessel = wert
#  - Unbekannte Schluessel werden still ignoriert.
#
#  EINHEITENSYSTEM (dimensionslos)
#  - Laengen in Einheiten von L0 (Gitterkonstante)
#  - Massen in Einheiten der Atommasse (m=1)
#  - Zeit in Einheiten von sqrt(m/K)*L0  (mit K=100 ist eine Zeiteinheit ~0.1 s)
#  - Energien in Einheiten von K*L0^2 (mit K=100 ist 1 Energieeinheit = 100)
#
# =============================================================================

# =============================================================================
#  [model] -- grundlegendes Modell-Setup
# =============================================================================
[model]

# Welches Kraftfeld verwenden?
#   A = harmonische Feder + Potenzgesetz-Abstossung r^{-12} (Standard)
#   B = Morse-Potenzial (anderes Binary erforderlich)
model        = A

# Healing = Frenkel-Paar-Rekombination (gerissene Bindungen koennen wieder
# schliessen, wenn die Atome zurueckkehren).
#   false = ausgeschaltet (Defekte sind permanent).  Fuer Benchmarks bevorzugt,
#           weil das die Laufzeit vorhersagbarer macht.
healing      = false

# Maximaler Abstand fuer Rekombination (in L0-Einheiten).  Nur relevant wenn
# healing=true.  Atome naeher als healing_dist * L0 koennen sich verbinden.
healing_dist = 1.10

# Maximale Relativgeschwindigkeit beider Atome fuer Rekombination.  Schnelle
# Atome heilen nicht -- sie wuerden sofort wieder auseinanderfliegen.
healing_vrel = 0.5

# =============================================================================
#  [grid] -- Gitterdimensionen
# =============================================================================
[grid]

# Anzahl der Atome in x-Richtung (Spalten).
# 1414 x 1414 = 1.999.396 ~= 2.0 Mio. Atome.  Diese Groesse ist so gewaehlt,
# dass das Arbeitsset (76 Byte/Atom x 2e6 = 152 MB) deutlich groesser als der
# L3-Cache (32 MB) ist und daher DRAM-Bandbreite die Laufzeit bestimmt.
NX = 1414            ; 1414 x 1414 ~ 2.0 Mio. Atome

# Anzahl der Atome in y-Richtung (Zeilen).
# Die MPI-Version zerlegt das Gitter entlang y in horizontale Streifen.
NY = 1414

# Gitterabstand / Gleichgewichtslaenge der harmonischen Federn.
# In dimensionslosen Einheiten fast immer 1.0.
L0 = 1.0

# Gittertyp (informativer Hinweis; der Code baut immer ein Dreiecksgitter).
# Dreiecksgitter: 6 Nachbarn pro Innenatom, schubstabil, elastisch isotrop.
# Wichtig: Ein Quadratgitter mit Axialfedern ist NICHT schubstabil!
lattice = triangular

# =============================================================================
#  [potential] -- Wechselwirkungs-Parameter
# =============================================================================
[potential]

# Federkonstante der harmonischen Nachbarbindungen.
# Bestimmt die Schallgeschwindigkeit: c = sqrt(K/m) * L0 = 10 L0/t_u.
# Auch bestimmend fuer die maximale Zeitschrittweite: dt_max ~ 0.2 / sqrt(K).
K_SPRING    = 100.0

# Bruchdehnung: Feder reisst wenn r > L0 * MAX_STRETCH.
# 1.15 = Bindung bricht bei 15% Dehnung ueber den Gleichgewichtsabstand.
MAX_STRETCH = 1.15

# Reichweite der repulsiven Kurzreichweits-Kraft (in L0-Einheiten).
# Muss kleiner als L0 sein!  Nur Paare mit r < RCUT stossen sich ab.
# Das gibt den Atomen einen effektiven Radius und ermoeglicht Kollisionen.
RCUT        = 0.9

# Amplitude der repulsiven Kraft.
# V_rep(r) = K_REP * [(RCUT/r)^REP_N * RCUT/(REP_N-1) - (RCUT-r)] + C
# (normiert auf V(RCUT)=0, F(RCUT)=0 -- keine Sprungkraft am Cutoff).
K_REP       = 400.0

# Steilheits-Exponent der Repulsion.  n=12 ist sehr steil (harter Kern).
# Groesseres n -> staerker lokalisierte Kollisionen, realitaetsnaeherer Stoss.
REP_N       = 12.0

# =============================================================================
#  [pka] -- Primary Knock-on Atom (Startimpuls der Kaskade)
# =============================================================================
#  Das PKA ist ein einzelnes Gitteratom, das zu Beginn hohe kinetische Energie
#  bekommt.  Es stoesst andere Atome an -- diese stoessen wieder andere an
#  (Kollisionskaskade).  Am Ende entstehen Cluster aus gerissenen Bindungen.
#
#  Fuer den Benchmark hier ist die Physik zweitrangig; wichtig ist nur, dass
#  es genug Aktivitaet gibt, um die Laufzeit zu bestimmen.
# =============================================================================
[pka]

# Relative x-Position des PKA im Gitter (0 = links, 1 = rechts).
pka_x      = 0.5

# Relative y-Position des PKA im Gitter (0 = unten, 1 = oben).
pka_y      = 0.5

# Kinetische Startenergie des PKA.
# v = sqrt(2*E/m).  Mit E=5000 und m=1: v = 100 L0/t_u >> Schallgeschw. (c=10).
# Das ist eine Hyperschallkaskade -- viele Bindungsbruche, grosses Schadensbild.
pka_energy = 5000.0

# Abschusswinkel gegenueber der negativen y-Achse (in Grad).
# 15 Grad vermeidet Symmetrieartefakte (Kaskade laeuft nicht exakt entlang
# einer Gitterrichtung, was unrealistisch kanal-artige Wege erzeugen wuerde).
pka_angle  = 15.0

# Masse des PKA.  1.0 = gleich schwer wie alle Gitteratome (elastischer Stoss
# uebertraegt maximale Energie).  Schwerere PKAs (>1) penetrieren tiefer.
pka_mass   = 1.0

# Anzahl der PKAs.
# 1 = einzelner Einschlag (Standard fuer Benchmarks und serielle Tests).
n_pka      = 1

# Phasen-Timing aktivieren? (nur MPI-Version)
#   true  = am Ende wird fuer jede Berechnungsphase die maximale und mittlere
#           Wandzeit ausgegeben (force, cells, hash, halo, migrate, energy).
#           Unverzichtbar fuer die Skalierungs-Analyse!
timing     = true

# Nicht-blockierender Halo-Austausch (nur MPI-Version)?
#   false = blockierend via MPI_Sendrecv (Standard, einfacher zu debuggen)
#   true  = nicht-blockierend via Isend/Irecv: beide Richtungen (up/down)
#           werden gleichzeitig gestartet -- spart die Serialisierung.
#   Hinweis: ueberlappt nur die beiden Richtungen, NICHT Rechnung+Kommunikation.
halo_nonblocking = false   ; true = Isend/Irecv (beide Richtungen parallel)

# Cell-lineare Neusortierung der Atome (nur MPI-Version).
#   0 = keine Neusortierung.
#   N > 0 = alle N Schritte nach Zellposition sortieren.
#   Hintergrund: durch Atomwanderung (swap-with-last in remove_atom) verlieren
#   die residenten Atome ihre Speicherortnung.  Neusortierung stellt Cache-
#   Lokalitaet wieder her und kann die Laufzeit um ~10% verbessern.
resort_every = 0           ; >0 = alle N Schritte cell-linear umsortieren

# =============================================================================
#  [dynamics] -- Zeitintegrations-Parameter
# =============================================================================
[dynamics]

# Zeitschrittweite fuer den Velocity-Verlet-Integrator.
# Stabilitaetskriterium: dt < 2/omega_max ~ 2/sqrt(K/m) = 0.2 (Sicherheitsfaktor ~100x).
# Mit pka_energy=5000 werden sehr schnelle Atome erzeugt; dt=2e-4 ist sicher.
dt            = 2e-4    ; sicher gegen Blow-up bei E=5000

# Anzahl der Zeitschritte.
# 3000 Schritte bei dt=2e-4 = 0.6 Zeiteinheiten Simzeit.
# Fuer echte Kaskaden braucht man 10000-15000 Schritte.  Fuer Zeitmessungen
# reichen 3000 -- die Laufzeit skaliert linear mit n_steps.
n_steps       = 3000    ; reicht fuer stabile Zeitmessung (kein Physik-Lauf)

# Daempfungskoeffizient (electronic stopping: schnelle Atome verlieren Energie
# an das Elektronensystem).
# 0.0 = ausgeschaltet.  Fuer Benchmarks immer 0, damit E_total = const.
damping       = 0.0

# Geschwindigkeitsschwelle fuer electronic stopping.
# v_thresh = 1e30 bedeutet: kein Stopping (kein Atom ist jemals schneller).
v_thresh      = 1e30

# Absorbierende Randzone (nur serielle Version, Platzhalter).
absorb_border = 0

# =============================================================================
#  [output] -- Ausgabesteuerung
# =============================================================================
[output]

# Alle wieviel Schritte wird Energie auf stdout ausgegeben?
# 3000 = nur am Ende -> minimaler Mess-Overhead (Energieberechnung ist teuer!).
log_every  = 3000       ; nur Anfang/Ende loggen -> minimaler Mess-Overhead

# XYZ-Frame-Dump fuer Animation (0 = deaktiviert).
# 0 ist fuer Benchmarks richtig -- jedes dump kostet Zeit und viel Speicher.
dump_every = 0

# (experimenteller Schalter, wird ignoriert wenn nicht implementiert)
enable_vtk = false

# Praefix fuer Ausgabedateien.
# Erzeugt:  scale_energy.csv, scale_state_final.csv, scale_broken_bonds.csv
out_prefix = scale

# =============================================================================
#  [ensemble] -- Reproduzierbarkeitsseed
# =============================================================================
[ensemble]

# Startwert des deterministischen Zufallszahlengenerators.
# Gleicher seed -> exakt gleiche PKA-Positionen und -Energien.
# Fuer Ensemble-Laeufe den seed von Lauf zu Lauf variieren (0, 1, 2, ...).
seed = 3

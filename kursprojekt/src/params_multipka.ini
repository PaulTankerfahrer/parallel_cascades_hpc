; =============================================================================
;  params_multipka.ini  --  Beispiel: mehrere PKAs individuell konfigurieren
; -----------------------------------------------------------------------------
;
;  ZWECK DIESER DATEI
;  Normalerweise gibt es genau einen PKA.  Diese Konfiguration zeigt, wie man
;  mehrere PKAs gleichzeitig starten kann -- entweder automatisch (n_pka > 1)
;  oder manuell mit individuellen Positionen und Energien ([pka1], [pka2], ...).
;
;  REGELN FUER DIE PKA-PLATZIERUNG
;  ---------------------------------
;  Modus 1 -- AUTO (n_pka > 1, KEINE [pkaN]-Sektionen vorhanden):
;    Das Programm verteilt n_pka PKAs deterministisch ueber die Domaene.
;    Der erste PKA landet bei (pka_x, pka_y), weitere an zufaelligen Positionen
;    (deterministisch aus seed berechnet).
;
;  Modus 2 -- MANUELL ([pka1], [pka2], ... vorhanden):
;    Jede [pkaN]-Sektion definiert einen PKA explizit.
;    Nicht angegebene Felder werden aus [pka] geerbt.
;    Es werden hoechstens n_pka PKAs platziert.
;    Sind weniger [pkaN] definiert als n_pka, werden nur die definierten gesetzt.
;
;  KONSISTENZ: Serielle und MPI-Version verhalten sich IDENTISCH
;  (gleicher deterministischer RNG, gleiche PKA-Listenverarbeitung).
;
;  LEERE LUECKEN: [pka2] kann weggelassen werden, dann wird [pka3] dennoch
;  erkannt und platziert -- die [pkaN]-Indizes muessen nicht lueckenlos sein.
;
; =============================================================================

; =============================================================================
;  [model] -- Modell-Setup
; =============================================================================
[model]

; Kraftfeld: A = harmonische Federn + Potenzgesetz-Abstossung (Standard)
model        = A

; Healing ausschalten.  Fuer Multi-PKA-Laeufe meist false, damit die Defekte
; aller Kaskaden erhalten bleiben und ausgewertet werden koennen.
healing      = false

; Rekombinations-Distanz (in L0).  Nur relevant wenn healing=true.
healing_dist = 1.10

; Rekombinations-Geschwindigkeitsschwelle.  Nur relevant wenn healing=true.
healing_vrel = 0.5

; =============================================================================
;  [grid] -- Gitterdimensionen
; =============================================================================
[grid]

; Gittergroesse: 1000 x 1000 = 1 Million Atome.
; Gross genug fuer 3 weit auseinanderliegende Kaskaden ohne Randeffekte.
NX = 1000
NY = 1000

; Gitterkonstante (Gleichgewichtslaenge der Federn).
L0 = 1.0

; Gittertyp (Kommentar; Dreiecksgitter ist immer verwendet).
lattice = triangular

; =============================================================================
;  [potential] -- Wechselwirkungs-Parameter
; =============================================================================
[potential]

; Federkonstante (bestimmt Schallgeschwindigkeit c = sqrt(K)*L0 = 10).
K_SPRING    = 100.0

; Bruchdehnung (Feder reisst bei r > L0 * 1.15).
MAX_STRETCH = 1.15

; Kurzreichweits-Reichweite (Atome naehe als RCUT stossen sich ab).
RCUT        = 0.9

; Staerke der Abstossung.
K_REP       = 400.0

; Steilheits-Exponent (n=12: sehr harter Kern, wie Lennard-Jones 12-6).
REP_N       = 12.0

; =============================================================================
;  [pka] -- Standard-PKA-Parameter und Gesamtzahl
; =============================================================================
;
;  Dieser Block hat eine DOPPELTE Funktion:
;   1) Gibt die Standardwerte (pka_x, pka_y, ...) an, die von [pkaN]-Sektionen
;      geerbt werden koennen.
;   2) Legt mit n_pka die MAXIMALE Anzahl der platzierten PKAs fest.
;
[pka]

; Maximale Anzahl der PKAs.  Hier 8, aber es sind nur 3 [pkaN] definiert
; -> es werden nur 3 PKAs platziert (der Rest wird ignoriert).
n_pka      = 8           ; Obergrenze; hier sind 3 [pkaN] definiert -> 3 genutzt

; Standardwerte -- werden genutzt, wenn ein [pkaN]-Block ein Feld weglasst.
; (Beispiel: [pka2] hat kein pka_angle -> erbt 15.0 Grad von hier.)
pka_x      = 0.5         ; Standardwerte (werden von [pkaN] geerbt, falls dort weggelassen)
pka_y      = 0.5
pka_energy = 5000.0
pka_angle  = 15.0
pka_mass   = 1.0

; =============================================================================
;  [pka1] -- Erster PKA: obere linke Ecke, horizontal nach rechts
; =============================================================================
;
;  Dieser PKA startet bei (0.25, 0.25) im Gitter (relative Koordinaten).
;  Winkel 90 Grad = Geschwindigkeit zeigt in positive x-Richtung.
;  Energie 5000 -> hohe Geschwindigkeit, grosse Kaskade.
;
[pka1]
pka_x      = 0.25
pka_y      = 0.25
pka_energy = 5000.0
pka_angle  = 90.0       ; 90 Grad = horizontal nach rechts geschossen
pka_mass   = 1.0

; =============================================================================
;  [pka2] -- Zweiter PKA: untere rechte Ecke, schraeg nach oben links
; =============================================================================
;
;  Weniger energetisch (3000 vs. 5000) -> kuerzere, schmaelere Kaskade.
;  pka_angle und pka_mass sind NICHT angegeben -> werden aus [pka] geerbt:
;    pka_angle = 15.0 Grad, pka_mass = 1.0
;
[pka2]
pka_x      = 0.75
pka_y      = 0.75
pka_energy = 3000.0      ; angle + mass werden aus [pka] geerbt (15 Grad, 1.0)

; =============================================================================
;  [pka3] -- Dritter PKA: Gittermitte, senkrecht nach unten
; =============================================================================
;
;  Groesste Energie -> laengste Kaskade.  Winkel 270 Grad = senkrecht nach
;  unten (negative y-Richtung).  pka_mass nicht angegeben -> 1.0 aus [pka].
;
[pka3]
pka_x      = 0.50
pka_y      = 0.50
pka_energy = 8000.0
pka_angle  = 270.0      ; 270 Grad = senkrecht nach unten

; =============================================================================
;  [dynamics] -- Zeitintegration
; =============================================================================
[dynamics]

; Zeitschrittweite.  Mit pka_energy bis 8000 braucht man ein kleines dt.
; Faustformel: dt < 1/(10 * sqrt(E_max)) ~ 3e-4 fuer E=8000.
dt      = 3e-4

; Lange Simulationszeit: 3 starke PKAs brauchen Zeit zum Abklingen.
; Die Kaskaden ueberlagern sich und ein laengeres Zeitfenster ist noetig.
n_steps = 12000

; Reproduzierbarkeitsseed.
seed    = 1

; =============================================================================
;  [output] -- Ausgabesteuerung
; =============================================================================
[output]

; Energie alle 300 Schritte ausgeben (detaillierter als log_every=500).
; Hilfreich um zu pruefen, ob alle drei Kaskaden stabil verlaufen.
log_every  = 300

; XYZ-Animations-Frames alle 300 Schritte speichern.
; Mit 12000 Schritten und dump_every=300 entstehen 40 Frames -> gutes GIF.
; Gelesbar mit OVITO oder preview_xyz.py.
dump_every = 300

; Dateinamen-Praefix.
out_prefix = run

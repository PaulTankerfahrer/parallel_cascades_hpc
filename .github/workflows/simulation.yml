# Simulation-CI (GitHub Actions): Build + Physik-Smoke-Test.
#
# GitHub-Variante der Forgejo-Workflows (.forgejo/workflows/). Auf den
# GitHub-Hosted-Runnern braucht es keinen Container: gcc/node/git sind da,
# apt laeuft ueber sudo. Nur billige Checks -- schwere Rechnung (Scaling,
# GPU, 1000-Ensembles) gehoert auf den Cluster, nicht in CI.
name: Simulation CI

on:
  push:
  pull_request:

jobs:
  build-and-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten (OpenMPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openmpi-bin libopenmpi-dev
      - name: Build + Physik-Smoke-Test
        run: bash scripts/ci/build_and_test.sh

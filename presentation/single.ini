; Konfiguration der Video-Kaskade.
;
; Bewusst identisch zum Fixed-Energy-Ensemble (results/statistik/ensemble_fest):
; NX=250, healing=true, dt=3e-4, 12000 Schritte, E=2400. Einschlagort und
; Winkel sind die von Lauf 276 -- der Lauf, der mit 72 Clustern genau auf dem
; Median der neuen Clusterdefinition liegt. Das Video zeigt damit exakt die
; Konfiguration, ueber die die Ergebnisfolien sprechen.
;
; Einziger Unterschied zum Ensemble-Lauf: dump_every>0, damit Frames anfallen.
[grid]
NX=250
NY=250
L0=1.0
lattice=triangular
[potential]
K_SPRING=100.0
MAX_STRETCH=1.15
RCUT=0.9
K_REP=400.0
REP_N=12.0
[pka]
pka_x=0.5405
pka_y=0.4787
pka_energy=2400.0
pka_angle=154.46
pka_mass=1.0
n_pka=1
[dynamics]
dt=3e-4
n_steps=12000
damping=0.0
v_thresh=1e30
[output]
log_every=12000
dump_every=40
out_prefix=single
[ensemble]
seed=276
healing=true

# =============================================================================
#  params_valgrind.ini  --  Kleines Setup fuer die Valgrind-Speicheranalyse
# -----------------------------------------------------------------------------
#  Valgrind (Memcheck) laeuft ~20-50x langsamer als natives Ausfuehren und
#  instrumentiert JEDEN Speicherzugriff.  Das 2-Mio-Atome-Benchmarkgitter
#  waere damit stundenlang unterwegs.  Fuer die reine Korrektheitspruefung
#  (Leaks, invalide Zugriffe, uninitialisierter Speicher) reicht ein kleines
#  Gitter mit wenigen Schritten -- alle Code-Pfade (Allokation, Kraft, Halo,
#  Migration, Free) werden trotzdem durchlaufen.
# =============================================================================

[model]
model        = A
healing      = false
healing_dist = 1.10
healing_vrel = 0.5

[grid]
NX = 80              ; 80 x 80 = 6400 Atome -- klein genug fuer Valgrind
NY = 80
L0 = 1.0
lattice = triangular

[potential]
K_SPRING    = 100.0
MAX_STRETCH = 1.15
RCUT        = 0.9
K_REP       = 400.0
REP_N       = 12.0

[pka]
pka_x      = 0.5
pka_y      = 0.5
pka_energy = 5000.0
pka_angle  = 15.0
pka_mass   = 1.0
n_pka      = 1
timing     = true
halo_nonblocking = false
resort_every = 0

[dynamics]
dt            = 2e-4
n_steps       = 300     ; wenige Schritte -- deckt alle Code-Pfade ab
damping       = 0.0
v_thresh      = 1e30
absorb_border = 0

[output]
log_every  = 300
dump_every = 0
enable_vtk = false
out_prefix = vg

[ensemble]
seed = 3
